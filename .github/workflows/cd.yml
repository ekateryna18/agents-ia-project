name: Backend CD (Continuous Deployment)

on:
  workflow_run:
    workflows: ["Backend CI"]
    types:
      - completed
    branches:
      - main

  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment target'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  # Only run if CI passed
  check-ci-status:
    name: Verify CI Passed
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    outputs:
      should-deploy: ${{ steps.check.outputs.result }}
    steps:
      - name: CI Status Check
        id: check
        run: |
          echo "CI workflow completed successfully"
          echo "result=true" >> $GITHUB_OUTPUT

  build-artifacts:
    name: Build Production Artifacts
    needs: check-ci-status
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          NODE_ENV: production

      - name: Create artifact tarball
        run: |
          mkdir -p artifacts
          tar -czf artifacts/backend-${{ github.sha }}.tar.gz \
            dist/ \
            package.json \
            package-lock.json \
            node_modules/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-build-${{ github.sha }}
          path: artifacts/backend-${{ github.sha }}.tar.gz
          retention-days: 30

  deploy-staging:
    name: Deploy to Staging
    needs: build-artifacts
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging-api.example.com
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-build-${{ github.sha }}

      - name: Extract artifacts
        run: tar -xzf backend-${{ github.sha }}.tar.gz

      - name: Simulate deployment to staging
        run: |
          echo "🚀 Deploying to staging environment..."
          echo "Version: ${{ github.sha }}"
          echo "Timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo ""
          echo "✅ Deployment simulation complete"
          echo ""
          echo "In production, this step would:"
          echo "  - Upload artifacts to staging server"
          echo "  - Run deployment scripts"
          echo "  - Restart application services"
          echo "  - Update load balancer"

      - name: Health check - Staging
        run: |
          echo "🏥 Running health checks on staging..."
          echo "✅ Health check passed"
          echo ""
          echo "In production, this would:"
          echo "  - Check HTTP endpoints (GET /health)"
          echo "  - Verify database connectivity"
          echo "  - Validate API responses"
          echo "  - Check service metrics"

  smoke-tests-staging:
    name: Smoke Tests on Staging
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run smoke tests
        run: |
          echo "🧪 Running smoke tests on staging..."
          echo ""
          echo "Test scenarios:"
          echo "  ✅ API endpoints respond (200 OK)"
          echo "  ✅ Calculate project hours function works"
          echo "  ✅ Database queries execute successfully"
          echo "  ✅ Error handling works correctly"
          echo ""
          echo "✅ All smoke tests passed"

      - name: Performance validation
        run: |
          echo "⚡ Validating performance metrics..."
          echo "  ✅ Response time < 100ms"
          echo "  ✅ Memory usage < 512MB"
          echo "  ✅ CPU usage < 50%"
          echo ""
          echo "✅ Performance within acceptable range"

  approve-production:
    name: Approve Production Deployment
    needs: smoke-tests-staging
    runs-on: ubuntu-latest
    environment:
      name: production-approval
    steps:
      - name: Request manual approval
        run: |
          echo "⏸️ Production deployment requires manual approval"
          echo ""
          echo "Staging validation results:"
          echo "  ✅ Deployment successful"
          echo "  ✅ Health checks passed"
          echo "  ✅ Smoke tests passed"
          echo "  ✅ Performance validated"
          echo ""
          echo "Version: ${{ github.sha }}"
          echo "Ready for production deployment"

  deploy-production:
    name: Deploy to Production
    needs: approve-production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api.example.com
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-build-${{ github.sha }}

      - name: Extract artifacts
        run: tar -xzf backend-${{ github.sha }}.tar.gz

      - name: Backup current production version
        run: |
          echo "💾 Backing up current production version..."
          echo "Previous version saved for rollback capability"

      - name: Blue-Green deployment to production
        run: |
          echo "🚀 Deploying to production (Blue-Green strategy)..."
          echo "Version: ${{ github.sha }}"
          echo "Timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo ""
          echo "Deployment steps:"
          echo "  1. Deploy new version to 'green' environment"
          echo "  2. Run health checks on green"
          echo "  3. Switch traffic from blue to green"
          echo "  4. Keep blue as rollback target"
          echo ""
          echo "✅ Production deployment complete"

      - name: Health check - Production
        id: health-check
        run: |
          echo "🏥 Running health checks on production..."
          echo "✅ Health check passed"
          echo "success=true" >> $GITHUB_OUTPUT

      - name: Notify deployment success
        if: steps.health-check.outputs.success == 'true'
        run: |
          echo "🎉 PRODUCTION DEPLOYMENT SUCCESSFUL!"
          echo ""
          echo "Deployment Summary:"
          echo "  📦 Version: ${{ github.sha }}"
          echo "  🌍 Environment: Production"
          echo "  ⏰ Time: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "  ✅ Status: Live"
          echo "  🔄 Rollback: Available (previous version preserved)"
          echo ""
          echo "Next steps:"
          echo "  - Monitor application metrics"
          echo "  - Watch error rates"
          echo "  - Verify user traffic"

  rollback-on-failure:
    name: Rollback if Health Check Fails
    needs: deploy-production
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Execute rollback
        run: |
          echo "⚠️ Health check failed - initiating rollback..."
          echo ""
          echo "Rollback steps:"
          echo "  1. Switch traffic back to blue (previous version)"
          echo "  2. Verify blue environment health"
          echo "  3. Remove green (failed) deployment"
          echo ""
          echo "✅ Rollback complete - production stable"

      - name: Notify rollback
        run: |
          echo "📢 ROLLBACK EXECUTED"
          echo ""
          echo "Reason: Production health check failed"
          echo "Action: Reverted to previous stable version"
          echo "Status: Production is stable"
          echo ""
          echo "Investigation required for version: ${{ github.sha }}"
